<div class="row">
    <div class="col-md-4 mt-4" *ngFor="let f of fruits">
        <div class="card h-100">
            <div class="card-header bg-primary">
                <h3>{{f.fruit}}</h3>
            </div>
            <div class="card-body">
                <img class="fruitImg" [src]="f.image" [alt]="f.fruit" [title]="f.fruit">
                <p>{{f.content}}</p>
            </div>
        </div>
    </div>
</div>
